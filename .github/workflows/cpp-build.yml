name: C++ Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with warnings enabled
        run: g++ -std=c++17 -Wall -Wextra Vertex-cover.cpp -o vertex-cover

      - name: Run sample
        run: ./vertex-cover
